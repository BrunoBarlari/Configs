# Terminal settings
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history limit
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Reload config with r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status bar
set -g status-position top
set -g status-style 'bg=#1a1b26 fg=#a9b1d6'
set -g status-left '#[fg=#7aa2f7,bold][#S] '
set -g status-right '#[fg=#9ece6a]%Y-%m-%d #[fg=#7aa2f7]%H:%M'
set -g status-left-length 50
set -g status-right-length 50

# Window status
setw -g window-status-current-style 'fg=#7aa2f7 bold'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-style 'fg=#565f89'
setw -g window-status-format ' #I:#W#F '

# Pane borders (tokyo-night style)
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# Message style
set -g message-style 'fg=#7aa2f7 bg=#1a1b26'
