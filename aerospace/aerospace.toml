# ===== STARTUP & GENERAL SETTINGS =====
start-at-login = true
after-login-command = ['exec-and-forget active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0']
after-startup-command = [
  'exec-and-forget active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
]

# ===== LAYOUT CONFIGURATION =====
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# ===== BEHAVIOR SETTINGS =====
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# ===== KEY MAPPING =====
[key-mapping]
preset = 'dvorak'

# ===== GAPS CONFIGURATION =====
[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       10
outer.bottom =     10
outer.top =        61  # 51 + 10 (compensate for SketchyBar top margin)
outer.right =      10

# ===== MAIN KEYBINDINGS =====
[mode.main.binding]

# Layout controls
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'

# Focus navigation (dvorak layout)
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-t = 'focus --boundaries-action wrap-around-the-workspace down'
alt-n = 'focus --boundaries-action wrap-around-the-workspace up'
alt-s = 'focus --boundaries-action wrap-around-the-workspace right'

# Move windows
alt-shift-h = 'move left'
alt-shift-t = 'move down'
alt-shift-n = 'move up'
alt-shift-s = 'move right'

# Resize windows
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Workspace navigation
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move windows to workspaces
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Workspace and monitor management
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Service mode
alt-shift-semicolon = 'mode service'

# ===== SERVICE MODE KEYBINDINGS =====
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join windows
alt-shift-d = ['join-with left', 'mode main']
alt-shift-h = ['join-with down', 'mode main']
alt-shift-t = ['join-with up', 'mode main']
alt-shift-n = ['join-with right', 'mode main']
